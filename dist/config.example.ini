[AutoWiFi]
; 目标 Wi-Fi 名称 (SSID)
SSID=Campus-WiFi

; 认证模式:
; 0 = 802.1X 企业级认证 (PEAP-MSCHAPv2)
; 1 = 网页 Portal 认证 (开放热点 + 网页登录)
; 2 = 网页 Portal 认证 (WPA2密码连接 + 网页登录)
; 3 = 双重认证 (802.1X 企业认证 + 网页 Portal 登录)
AuthMode=0

; 登录账号
Username=your_account

; 明文密码 (首次由程序保存后会自动转为 DPAPI 加密字段 PasswordEnc 并删除 PlainPassword)
PlainPassword=your_password

; 802.1X 认证域 (选填) 或 AuthMode=2 时的 Wi-Fi 预共享密钥
DomainOrPsk=

; 网页 Portal 登录接口 URL (留空则自动探测重定向地址)
PortalUrl=

; Portal 请求方式: 0=POST表单(urlencoded), 1=POST JSON, 2=GET查询参数
PortalMethod=0

; Portal 表单/JSON 中的账号与密码字段名
PortalUserField=username
PortalPassField=password

; Portal 附加请求参数 (例如 ac_id=1&0MKKey=123456)
PortalExtraParams=

; 是否开启断线自动重连 (1=开启, 0=关闭)
AutoConnect=1

; 自动检测与重连间隔 (秒, 范围 3-3600)
CheckIntervalSec=15
